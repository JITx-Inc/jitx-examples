# pyproject.toml

[build-system]
requires = [
  "hatchling>=1.27.0,<2.0",
  "hatch-vcs>=0.5.0,<0.6.0",
  "ruff==0.14.9",
  "pyright>=1.1.398,<1.2.0",
]
build-backend = "hatchling.build"

[project]
name = "jitxexamples"
dynamic = ["version"]
dependencies = [
  "jitx>=4.6.0rc2,<4.7",
  "jitxlib-standard>=4.6.0rc2,<4.7",
  "jitxlib-parts>=2.0.0rc1,<3",
  # JS5's reference builds on its RO4350B substrates, planned for jitxlib-jlcpcb
  # 4.1.0 (unreleased on 2026-11-11), so that release must come first.
  "jitxlib-jlcpcb>=4.1.0a1,<5",
  "eseries>=1.2.1,<2",
  "shapely>=2.1,<3",
]
requires-python = ">=3.12"
authors = [
  {name = "JITX"}
]
maintainers = [
  {name = "JITX"}
]
description = "Library of example JITX components, substrates, and demo designs"

[project.urls]
Homepage = "https://jitx.com"
Documentation = "https://docs.jitx.com"

[tool.hatch.build.targets.wheel]
packages = ["src/jitxexamples"]

# The sdist otherwise ships the whole non-gitignored tree, which is how
# `jumpstart-kits/` reaches docs.jitx.com (the docs build extracts it from the
# released sdist). Only `exclude` is set here so that default file selection --
# and therefore `jumpstart-kits/` -- is preserved. The repo has no `internal`
# tree; the entry stays as a guard, so a maintainer-only tree of that name, if
# one is added again, reaches no deployment surface.
[tool.hatch.build.targets.sdist]
exclude = ["internal"]

[tool]

# tests: run "hatch test --cover"
[tool.hatch.envs.hatch-test]
randomize = true
parallel = false
installer = "pip"
extra-args = ["-vv"]
dependencies = [
  "coverage[toml]",
  "pytest",
  "pytest-cov",
  # `randomize = true` above needs the plugin; overriding `dependencies`
  # replaces hatch's default list, which is where it would otherwise come from.
  "pytest-randomly",
  # test_docstring_rst.py parses docstrings the way the docs build does, which
  # means napoleon's preprocessing and docutils -- both of which arrive with
  # Sphinx. Same pin as the `types` env and docs/requirements.txt.
  "sphinx>=8.1.0,<9.0",
]

[[tool.hatch.envs.test.matrix]]
python = ["3.12", "3.13", "3.14"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0+undefined"

# formatting: run "hatch fmt --check"
[tool.hatch.envs.hatch-static-analysis]
dependencies = ["ruff==0.14.9"]
config-path = "none"  # don't use hatch defaults

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
# To enable:
# UP, TC
select = ["E", "F", "W", "A", "B", "C"]
# E501 line too long - let ruff format handle that
# A002 variable shadowing built-in (id, min, max)
# A005 builtin module shadowing (false positive)
# C901 mccabe complexity check, limits to 10
ignore = ["E501", "A005", "C901", "A002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

# pyright: run "hatch run types:check"
[tool.hatch.envs.types]
extra-dependencies = [
  "pyright>=1.1.0",
  "pytest",
  "sphinx>=8.1.0,<9.0",
]

[tool.hatch.envs.types.scripts]
check = "pyright ."
stats = "pyright --stats ."

[tool.pyright]
# Setting `exclude` REPLACES pyright's defaults, so the default patterns are
# repeated here. Without `**/.*`, a project-local `.venv` (or any dotdir) gets
# type-checked along with all of site-packages.
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "docs",
    # The repo has no `internal` tree; the entry stays as a guard, so a
    # maintainer-only tree of that name, if one is added again, is not type-checked.
    "internal",
]
typeCheckingMode = "standard"
reportMissingImports = "warning"

[tool.coverage.run]
# Only track coverage for our source code, not JITX library internals
source = ["src"]

[tool.coverage.report]
ignore_errors = true

[tool.jitx]
exclude = ["docs", "internal", "tests"]

# Passive queries (`jitxlib.parts.Resistor`, `Capacitor`, `Inductor`) go to the
# example catalogue first. `ideal` then synthesizes a non-orderable `IDEAL-*` part:
# it snaps a single pinned value to E24, honors case (0402 if none is named) and
# tolerance (1% unless one is pinned), and ignores every other filter, such as a
# voltage or current rating. It declines a value range, or a query its snapped
# value, case or tolerance does not meet; those must match a catalogue row. The
# max_current, self_resonant_frequency, quality_factor and material_core columns
# are filled only where a datasheet value was checked. A blank cell never matches
# a query on that column, so in this chain such a query falls through to `ideal`.
[tool.jitx.parts]
chain = ["csv:src/jitxexamples/parts/example-passives.csv", "ideal"]
